# Txori Kantua (issue #24): bounded log rotation on the SD card.
#
#   sudo install -D -m 0644 90-txori-journal.conf /etc/systemd/journald.conf.d/90-txori-journal.conf
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage     # must stay below SystemMaxUse
#
# Journald rotates by size and age and deletes the oldest files first. The
# whole journal used 8 MiB on the station Pi on 17/11/2026, so 64 MiB leaves
# room for the new services while bounding SD usage. The logs carry no audio, no
# credentials and no personal data: see docs/health-monitoring.md.
[Journal]
SystemMaxUse=64M
SystemKeepFree=1G
SystemMaxFileSize=8M
MaxRetentionSec=30day
MaxFileSec=1week
