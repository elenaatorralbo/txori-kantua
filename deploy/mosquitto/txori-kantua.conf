# Mosquitto for Txori Kantua (issue #13).
# Installed in /etc/mosquitto/conf.d/txori-kantua.conf by setup_broker.sh.
# Tested with: NO version yet. Written for Mosquitto 2.x; not run on the
# Raspberry Pi. Record the real version in docs/broker.md when validating it.

# One security setting per listener: without this, the options of one listener
# would silently apply to all of them.
per_listener_settings true

# --- Local listener -----------------------------------------------------------
# Loopback interface only: every MVP service runs on the Pi itself. What does
# not listen on the network needs neither TLS nor a firewall.
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/txori-kantua.passwd
acl_file /etc/mosquitto/txori-kantua.acl

# --- Local network listener (DISABLED) ----------------------------------------
# Only if a service moves to another machine (ADR 0004 considers Grafana off
# the Pi, but Grafana does not use MQTT). Exposing the broker on the network
# requires TLS: with user and password in clear text, anyone on the network
# could read them. Enabling it requires certificates and a decision recorded
# in docs/broker.md.
#
# listener 8883 0.0.0.0
# protocol mqtt
# allow_anonymous false
# password_file /etc/mosquitto/txori-kantua.passwd
# acl_file /etc/mosquitto/txori-kantua.acl
# cafile /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# tls_version tlsv1.2

# --- Persistence --------------------------------------------------------------
# Keeps on disk the retained messages (health, availability) and the queued
# QoS 1 messages for persistent-session clients, such as ingest. Without this,
# a broker restart would lose what is pending delivery.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60

# --- Limits -------------------------------------------------------------------
# Contract cap: 16 KiB per message (contracts/README.md). The broker rejects it
# before it reaches any consumer.
message_size_limit 16384
# Bounded queue per disconnected client: metadata, never audio. When full, new
# messages for that client are discarded and logged.
max_queued_messages 5000
max_inflight_messages 20
# An abandoned persistent session does not accumulate messages forever.
persistent_client_expiration 7d

# --- Logging ------------------------------------------------------------------
# No "debug": that level may write message contents.
log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
