# Txori Kantua (issue #11): swap only in compressed RAM, never on the SD card.
#
# Install on Raspberry Pi OS Trixie (rpi-swap) and REBOOT:
#   sudo install -D -m 0644 90-txori-zram-only.conf /etc/rpi/swap.conf.d/90-txori-zram-only.conf
#   sudo reboot
#
# The default Mechanism=auto currently means "zram+file": zram writes idle
# pages back to /var/swap on disk, which could include pages holding audio.
# "zram" keeps the memory headroom without any writeback file; "none" is the
# stricter alternative if the BirdNET measurement (#8) shows it is not needed.
# See man swap.conf(5) and docs/adr/0006-transient-audio.md.
[Main]
Mechanism=zram
