# Txori Kantua (issue #11): never store core dumps (they would contain audio).
#
#   sudo install -D -m 0644 90-txori-no-coredump.conf /etc/systemd/coredump.conf.d/90-txori-no-coredump.conf
#   sudo systemctl daemon-reload
#
# Only used when kernel.core_pattern pipes to systemd-coredump. Independently,
# every audio service sets LimitCORE=0. See docs/adr/0006-transient-audio.md.
[Coredump]
Storage=none
ProcessSizeMax=0
