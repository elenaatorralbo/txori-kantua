[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txori-kantua"
version = "0.1.0.dev0"
description = "IoT station for local recognition of bird songs"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies of the modules that ALREADY exist. Each new module adds
# its own in its own PR. The ranges are the ones tested in development; the
# exact versions verified on the Raspberry Pi 5 are pinned in issue #2.
dependencies = [
    "jsonschema>=4.18",
    "referencing>=0.30",
]

[project.optional-dependencies]
# BirdNET inference (issue #8). ai-edge-litert publishes aarch64 wheels for
# Python 3.13 (Raspberry Pi OS Trixie); tflite-runtime stops at 3.11. Exact
# versions are pinned after the measurement on the Pi.
birdnet = [
    "numpy>=1.26",
    "ai-edge-litert>=2.0",
]
# Environmental sensors (issue #4). On the Pi, python3-smbus2 from apt also works.
sensors = [
    "smbus2>=0.4",
]
dev = [
    "pytest>=8",
    "PyYAML>=6",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"txori_kantua.audio" = ["corpus.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# Tests write synthetic tones to tmp_path; keeping them would pollute the
# privacy audit of /tmp on the Pi (issue #11). Kept only to debug a failure.
tmp_path_retention_policy = "failed"
markers = [
    "hardware: requires a Raspberry Pi and real peripherals; not run in CI",
    "broker: requires a reachable real MQTT broker",
    "model: requires the BirdNET model files (TXORI_BIRDNET_MODEL_DIR)",
]
