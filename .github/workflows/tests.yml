name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -m 'not hardware and not broker and not model'
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients
      - name: Allow only the isolated broker files through AppArmor
        run: |
          for profile in /etc/apparmor.d/mosquitto /etc/apparmor.d/usr.sbin.mosquitto; do
            if test -f "$profile"; then
              sudo install -D -m 0644 deploy/ci/mosquitto.apparmor /etc/apparmor.d/local/mosquitto
              sudo apparmor_parser -r "$profile"
            fi
          done
      - run: python -m pip install -e '.[dev]'
      - run: python tools/verify_pipeline.py --mosquitto /usr/sbin/mosquitto --passwd /usr/bin/mosquitto_passwd
